<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
#videoBox{flex:1; background:#111; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden}
#v{width:100%; height:100%; object-fit:contain}
#info{position:absolute; top:5px; left:0; right:0; text-align:center; font-size:12px; color:#0f0; background:rgba(0,0,0,0.5); padding:3px}
#ctrl{
  background:#111; padding:8px; 
  display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
  border-top:1px solid #333;
}
#ctrl button{padding:10px 12px; font-size:14px; border-radius:8px; border:1px solid #555; background:#222; color:#fff; flex:1; max-width:120px}
</style></head><body>
<div id="videoBox">
  <video id="v" autoplay playsinline muted></video>
  <div id="info">연결중</div>
</div>
<div id="ctrl">
  <button id="btnFlip">📷 전환</button>
  <button id="btnRes">🔍 360x480</button>
  <button id="btnFps">⚡ 15fps</button>
</div>
<script>
const v=document.getElementById('v'), info=document.getElementById('info');
let ws=null, stream=null, facing="environment", want1080=false, want30fps=false;
function connect(){
  const proto = location.protocol==='https:'?'wss://':'ws://';
  ws=new WebSocket(proto+location.host+'/ws/phone');
  ws.binaryType='arraybuffer';
  ws.onopen=()=>info.textContent='✅ 연결됨';
  ws.onclose=()=>setTimeout(connect,1000);
}
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:facing, width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:15}}, audio:false
  });
  v.srcObject=stream;
}
function sendLoop(){
  const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
  const W=360, H=480;
  function loop(){
    if(v.videoWidth && ws && ws.readyState===1){
      canvas.width=W; canvas.height=H;
      const vw=v.videoWidth, vh=v.videoHeight, targetAspect=W/H;
      let sx, sy, sw, sh;
      if(vw/vh > targetAspect){ sh=vh; sw=sh*targetAspect; sx=(vw-sw)/2; sy=0; }
      else { sw=vw; sh=sw/targetAspect; sx=0; sy=(vh-sh)/2; }
      ctx.drawImage(v, sx, sy, sw, sh, 0, 0, W, H);
      canvas.toBlob(b=>{ if(b) b.arrayBuffer().then(x=>ws.send(x)) },'image/jpeg',0.6);
    }
    setTimeout(()=>requestAnimationFrame(loop), 66);
  }
  loop();
}
document.getElementById('btnFlip').onclick=()=>{ facing=facing==='environment'?'user':'environment'; startCam(); };
document.getElementById('btnRes').onclick=e=>{ want1080=!want1080; e.target.textContent=want1080?'🔍 고화질':'🔍 360x480'; startCam(); };
document.getElementById('btnFps').onclick=()=>{ want30fps=!want30fps; };
connect(); startCam(); sendLoop();
</script>
</body></html>
